AWSTemplateFormatVersion: "2010-09-09"
Description: Security groups for load balancer and application instances

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Target deployment environment
  VpcId:
    Type: String
    Description: VPC ID to create security groups in

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Environment} - ALB security group"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Allow HTTP from anywhere
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Allow HTTPS from anywhere
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-alb-sg"
        - Key: Environment
          Value: !Ref Environment

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Environment} - Application instance security group"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Allow traffic from ALB on port 80
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - Description: Allow traffic from ALB on port 443
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-app-sg"
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroup
    Description: Security group ID for the ALB
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Description: Security group ID for application instances
