AWSTemplateFormatVersion: "2010-09-09"
Description: S3 bucket for hosting CloudFormation nested stack templates

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Target deployment environment

Resources:
  TemplatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Environment}-cfn-templates-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  BucketName:
    Value: !Ref TemplatesBucket
    Description: Name of the S3 bucket hosting nested stack templates
  BucketArn:
    Value: !GetAtt TemplatesBucket.Arn
    Description: ARN of the templates bucket
